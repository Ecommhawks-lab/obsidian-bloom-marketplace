<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Admin | Obsidian Bloom</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital@0;1&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  body{background:#131313;color:#e5e2e1;font-family:'Manrope',sans-serif}.serif{font-family:'Noto Serif',serif}
  .badge{font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border-radius:9999px}
  .badge.pending{background:#4d4635;color:#ffe088}.badge.approved{background:#1f5f37;color:#bfe6cd}.badge.rejected{background:#5f2320;color:#ffb4ab}
  th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid #2a2a2a;font-size:13px}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#99907c}
  .btn{padding:.35rem .8rem;border-radius:9999px;font-size:11px;cursor:pointer}
  .approve{background:#f2ca50;color:#3c2f00}.reject{background:transparent;border:1px solid #5f2320;color:#ffb4ab}
  .pay{background:#635bff;color:#fff}
  .ob-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#f2ca50;color:#14110f;padding:12px 22px;border-radius:40px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
  .ob-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.ob-toast.err{background:#ffb4ab}
</style>
</head>
<body class="min-h-screen">
<header class="flex items-center justify-between px-6 lg:px-12 py-6 border-b border-[#D4AF37]/15">
  <span class="serif text-xl text-[#f2ca50]">Obsidian Bloom · Admin</span>
  <button id="logout" class="text-[10px] uppercase tracking-widest text-[#E3E2E0]/40 hover:text-[#FFBCD4]">Sign out</button>
</header>
<main class="px-6 lg:px-12 py-10 space-y-14 max-w-6xl">
  <section>
    <h2 class="serif text-2xl text-primary-fixed text-[#ffe088] mb-6">Submissions</h2>
    <div class="overflow-x-auto"><table class="w-full"><thead><tr><th>Product</th><th>Vendor</th><th>Price</th><th>Status</th><th></th></tr></thead>
      <tbody id="prodRows"><tr><td colspan="5" class="text-[#99907c]">Loading…</td></tr></tbody></table></div>
  </section>
  <section>
    <h2 class="serif text-2xl text-[#ffe088] mb-2">Vendor Earnings</h2>
    <p id="commNote" class="text-xs text-[#99907c] mb-6"></p>
    <div class="overflow-x-auto"><table class="w-full"><thead><tr><th>Vendor</th><th>Owed</th><th>Total</th><th>Stripe</th><th></th></tr></thead>
      <tbody id="earnRows"><tr><td colspan="5" class="text-[#99907c]">Loading…</td></tr></tbody></table></div>
  </section>
</main>
<div id="toast" class="ob-toast"></div>
<script>
  var $=function(i){return document.getElementById(i)};var tT;
  function toast(m,e){var t=$('toast');t.textContent=m;t.className='ob-toast show'+(e?' err':'');clearTimeout(tT);tT=setTimeout(function(){t.className='ob-toast'},3200)}
  function money(c,cur){return (cur||'usd').toUpperCase()+' '+(c/100).toFixed(2)}
  $('logout').addEventListener('click',async function(){await fetch('/auth/logout',{method:'POST'});location.href='/login'});

  async function loadProducts(){
    var j=await (await fetch('/api/admin/products')).json();
    if(!j.ok){location.href='/login';return}
    $('prodRows').innerHTML=j.products.length?j.products.map(function(p){
      var actions=p.status==='pending'
        ? '<button class="btn approve" data-a="approve" data-id="'+p.id+'">Approve</button> <button class="btn reject" data-a="reject" data-id="'+p.id+'">Reject</button>'
        : (p.status==='approved'?'<button class="btn reject" data-a="reject" data-id="'+p.id+'">Unpublish</button>':'<button class="btn approve" data-a="approve" data-id="'+p.id+'">Approve</button>');
      return '<tr><td>'+p.title+'</td><td>'+p.business_name+'<br><span class="text-[#99907c] text-[11px]">'+p.email+'</span></td><td>$'+p.price+'</td><td><span class="badge '+p.status+'">'+p.status+'</span></td><td>'+actions+'</td></tr>';
    }).join(''):'<tr><td colspan="5" class="text-[#99907c]">No submissions.</td></tr>';
    document.querySelectorAll('#prodRows .btn').forEach(function(b){b.addEventListener('click',async function(){
      b.disabled=true;
      try{var r=await (await fetch('/api/admin/products/'+b.dataset.id+'/'+b.dataset.a,{method:'POST'})).json();
        if(!r.ok)throw new Error(r.error);toast('Done ✓');loadProducts()}
      catch(e){toast(e.message,true);b.disabled=false}
    })});
  }
  async function loadEarnings(){
    var j=await (await fetch('/api/admin/earnings')).json();
    if(!j.ok)return;
    $('commNote').textContent='Platform commission: '+j.commission+'%. Owed = unpaid net after commission.';
    $('earnRows').innerHTML=j.vendors.length?j.vendors.map(function(v){
      var pay=(v.owed_cents>0&&v.stripe_account_id)?'<button class="btn pay" data-vid="'+v.vendor_id+'">Pay out</button>':'';
      return '<tr><td>'+v.business_name+'<br><span class="text-[#99907c] text-[11px]">'+v.email+'</span></td><td>'+money(v.owed_cents,v.currency)+'</td><td>'+money(v.total_cents,v.currency)+'</td><td>'+(v.stripe_account_id?'✓':'—')+'</td><td>'+pay+'</td></tr>';
    }).join(''):'<tr><td colspan="5" class="text-[#99907c]">No vendors.</td></tr>';
    document.querySelectorAll('#earnRows .pay').forEach(function(b){b.addEventListener('click',async function(){
      b.disabled=true;
      try{var r=await (await fetch('/api/admin/payout/'+b.dataset.vid,{method:'POST'})).json();
        if(!r.ok)throw new Error(r.error);toast('Paid out ✓');loadEarnings()}
      catch(e){toast(e.message,true);b.disabled=false}
    })});
  }
  loadProducts();loadEarnings();
</script>
</body></html>
