<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<meta name="theme-color" content="#131313">
<title>Admin | Obsidian Bloom</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark}
  *{-webkit-tap-highlight-color:transparent}
  body{background:#131313;color:#e5e2e1;font-family:'Manrope',sans-serif}.serif{font-family:'Noto Serif',serif}
  .badge{font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:3px 10px;border-radius:9999px;white-space:nowrap}
  .badge.pending{background:#4d4635;color:#ffe088}.badge.approved{background:#1f5f37;color:#bfe6cd}.badge.rejected{background:#5f2320;color:#ffb4ab}
  .btn{min-height:40px;padding:.5rem 1rem;border-radius:9999px;font-size:12px;cursor:pointer;transition:.15s;flex:1;white-space:nowrap}
  .btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
  .approve{background:#f2ca50;color:#3c2f00;font-weight:600}.reject{background:transparent;border:1px solid #5f2320;color:#ffb4ab}
  .pay{background:#635bff;color:#fff;font-weight:600}
  .card{background:#1a1917;border:1px solid rgba(212,175,55,.12);border-radius:18px;padding:1.1rem 1.15rem}
  .stat{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#99907c}
  .ob-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#f2ca50;color:#14110f;padding:12px 22px;border-radius:40px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
  .ob-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.ob-toast.err{background:#ffb4ab}
</style>
</head>
<body class="min-h-screen" style="min-height:100dvh">
<header class="sticky top-0 z-50 bg-[#131313]/95 backdrop-blur border-b border-[#D4AF37]/15">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-10 h-16 flex items-center justify-between gap-3">
    <span class="serif text-lg sm:text-xl text-[#f2ca50] truncate">Obsidian Bloom · Admin</span>
    <button id="logout" class="text-[10px] uppercase tracking-widest text-[#E3E2E0]/50 hover:text-[#FFBCD4] whitespace-nowrap">Sign out</button>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-10 py-8 sm:py-10 space-y-12">
  <section>
    <h2 class="serif text-2xl text-[#ffe088] mb-5">Submissions</h2>
    <div id="prodRows" class="grid grid-cols-1 sm:grid-cols-2 gap-4"><p class="text-[#99907c] text-sm">Loading…</p></div>
  </section>

  <section>
    <h2 class="serif text-2xl text-[#ffe088] mb-1">Vendor Earnings</h2>
    <p id="commNote" class="text-xs text-[#99907c] mb-5"></p>
    <div id="earnRows" class="grid grid-cols-1 sm:grid-cols-2 gap-4"><p class="text-[#99907c] text-sm">Loading…</p></div>
  </section>
</main>

<div id="toast" class="ob-toast"></div>
<script>
  var $=function(i){return document.getElementById(i)};var tT;
  function toast(m,e){var t=$('toast');t.textContent=m;t.className='ob-toast show'+(e?' err':'');clearTimeout(tT);tT=setTimeout(function(){t.className='ob-toast'},3200)}
  function money(c,cur){return (cur||'usd').toUpperCase()+' '+(c/100).toFixed(2)}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  $('logout').addEventListener('click',async function(){await fetch('/auth/logout',{method:'POST'});location.href='/login'});

  async function loadProducts(){
    var j=await (await fetch('/api/admin/products')).json();
    if(!j.ok){location.href='/login';return}
    $('prodRows').innerHTML=j.products.length?j.products.map(function(p){
      var actions=p.status==='pending'
        ? '<button class="btn approve" data-a="approve" data-id="'+p.id+'">Approve</button><button class="btn reject" data-a="reject" data-id="'+p.id+'">Reject</button>'
        : (p.status==='approved'?'<button class="btn reject" data-a="reject" data-id="'+p.id+'">Unpublish</button>':'<button class="btn approve" data-a="approve" data-id="'+p.id+'">Approve</button>');
      return '<div class="card flex flex-col gap-3">'
        +'<div class="flex items-start justify-between gap-3">'
          +'<h3 class="serif text-lg text-on-surface leading-tight break-words min-w-0">'+esc(p.title)+'</h3>'
          +'<span class="badge '+p.status+'">'+p.status+'</span>'
        +'</div>'
        +'<div class="min-w-0"><p class="text-sm text-on-surface truncate">'+esc(p.business_name)+'</p>'
          +'<p class="text-[11px] text-[#99907c] truncate">'+esc(p.email)+'</p></div>'
        +'<div class="flex items-center justify-between gap-3 pt-1">'
          +'<span class="serif text-lg text-[#ffe088]">$'+esc(p.price)+'</span>'
          +'<div class="flex gap-2 flex-1 max-w-[220px]">'+actions+'</div>'
        +'</div>'
      +'</div>';
    }).join(''):'<p class="text-[#99907c] text-sm">No submissions yet.</p>';
    document.querySelectorAll('#prodRows .btn').forEach(function(b){b.addEventListener('click',async function(){
      b.disabled=true;
      try{var r=await (await fetch('/api/admin/products/'+b.dataset.id+'/'+b.dataset.a,{method:'POST'})).json();
        if(!r.ok)throw new Error(r.error);toast('Done ✓');loadProducts()}
      catch(e){toast(e.message,true);b.disabled=false}
    })});
  }

  async function loadEarnings(){
    var j=await (await fetch('/api/admin/earnings')).json();
    if(!j.ok)return;
    $('commNote').textContent='Platform commission: '+j.commission+'%. Owed = unpaid net after commission.';
    $('earnRows').innerHTML=j.vendors.length?j.vendors.map(function(v){
      var pay=(v.owed_cents>0&&v.stripe_account_id)?'<button class="btn pay" data-vid="'+v.vendor_id+'">Pay out '+money(v.owed_cents,v.currency)+'</button>':'';
      return '<div class="card flex flex-col gap-4">'
        +'<div class="min-w-0"><p class="serif text-lg text-on-surface truncate">'+esc(v.business_name)+'</p>'
          +'<p class="text-[11px] text-[#99907c] truncate">'+esc(v.email)+'</p></div>'
        +'<div class="grid grid-cols-3 gap-2">'
          +'<div><p class="stat">Owed</p><p class="text-sm text-[#ffe088] mt-1">'+money(v.owed_cents,v.currency)+'</p></div>'
          +'<div><p class="stat">Total</p><p class="text-sm text-on-surface mt-1">'+money(v.total_cents,v.currency)+'</p></div>'
          +'<div><p class="stat">Stripe</p><p class="text-sm mt-1">'+(v.stripe_account_id?'<span class="text-[#bfe6cd]">Connected</span>':'<span class="text-[#99907c]">—</span>')+'</p></div>'
        +'</div>'
        +(pay?'<div class="flex">'+pay+'</div>':'')
      +'</div>';
    }).join(''):'<p class="text-[#99907c] text-sm">No vendors yet.</p>';
    document.querySelectorAll('#earnRows .pay').forEach(function(b){b.addEventListener('click',async function(){
      b.disabled=true;
      try{var r=await (await fetch('/api/admin/payout/'+b.dataset.vid,{method:'POST'})).json();
        if(!r.ok)throw new Error(r.error);toast('Paid out ✓');loadEarnings()}
      catch(e){toast(e.message,true);b.disabled=false}
    })});
  }
  loadProducts();loadEarnings();
</script>
</body></html>
