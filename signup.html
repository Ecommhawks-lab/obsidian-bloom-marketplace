<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create vendor account | Obsidian Bloom</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital@0;1&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>body{background:#131313;color:#e5e2e1;font-family:'Manrope',sans-serif}.serif{font-family:'Noto Serif',serif}
input{background:transparent;border-bottom:1px solid #4d4635;padding:.6rem 0;width:100%;color:#e5e2e1}input:focus{outline:none;border-color:#f2ca50}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-5 py-10">
<div class="w-full max-w-sm">
  <div class="text-center mb-10"><span class="serif text-2xl text-[#f2ca50]">Obsidian Bloom</span><p class="text-xs text-[#99907c] uppercase tracking-widest mt-2">Become a Curator</p></div>
  <form id="form" class="space-y-6">
    <input id="business_name" type="text" placeholder="Business / Atelier name" required>
    <input id="vat" type="text" placeholder="VAT / Dealer number (optional)">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password (min 8 characters)" required minlength="8">
    <button class="w-full py-3 rounded-full bg-[#f2ca50] text-[#3c2f00] font-semibold hover:opacity-90 transition">Create account</button>
  </form>
  <p id="msg" class="text-center text-xs mt-4 h-4"></p>
  <p class="text-center text-xs text-[#99907c] mt-6">Already a vendor? <a class="text-[#f2ca50]" href="/login">Sign in</a></p>
</div>
<script>
  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = document.getElementById('msg'); msg.textContent = '…'; msg.style.color = '#99907c';
    try {
      var r = await fetch('/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ business_name: business_name.value, vat: vat.value, email: email.value, password: password.value }) });
      var j = await r.json();
      if (!j.ok) throw new Error(j.error || 'Failed');
      location.href = '/dashboard';
    } catch (err) { msg.textContent = err.message; msg.style.color = '#ffb4ab'; }
  });
</script>
</body></html>
