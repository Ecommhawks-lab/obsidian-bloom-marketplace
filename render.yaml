# One-click deploy on Render (render.com). Push the folder to a Git repo,
# then "New + > Blueprint" and point it at this file. Data lives in Turso, so
# this runs fine on the FREE plan with no persistent disk.
services:
  - type: web
    name: obsidian-bloom-marketplace
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: "2024-10"
      - key: PRODUCT_TYPE
        value: Bouquet
      - key: PLATFORM_COMMISSION_PCT
        value: "15"
      # BASE_URL: set to your Render URL after first deploy, e.g. https://obsidian-bloom-marketplace.onrender.com
      - key: BASE_URL
        sync: false
      # Turso database (free, persistent) — create at https://turso.tech
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Secrets — set these in the Render dashboard (never commit them)
      - key: SHOP
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
